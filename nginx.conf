server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on; gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Hashed build assets: cache forever.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
  # Service worker + entry must revalidate so updates roll out.
  location = /sw.js { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; }
  location / { try_files $uri $uri/ /index.html; }
}
