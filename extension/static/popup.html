<!doctype html>
<html><head><meta charset="utf-8"/><title>Prompt Converter</title>
<style>
:root{color-scheme:light dark;--a:#0071e3;--bg:#f5f5f7;--s:#fff;--t:#1d1d1f;--m:#6e6e73;--sep:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--s:#1c1c1e;--t:#f5f5f7;--m:#98989d;--sep:rgba(255,255,255,.1);--a:#0a84ff}}
body{margin:0;width:400px;font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}h1{font-size:15px;margin:0}
main{padding:0 14px 14px;display:grid;gap:10px}.card{background:var(--s);border-radius:14px;padding:12px;display:grid;gap:8px}
textarea,input,select{width:100%;box-sizing:border-box;border:1px solid var(--sep);border-radius:10px;padding:8px 10px;font:inherit;background:var(--bg);color:var(--t)}
textarea{min-height:90px;resize:vertical}label{font-size:12px;color:var(--m);display:grid;gap:4px}
button{border:0;border-radius:980px;padding:7px 16px;font:600 13px inherit;cursor:pointer;background:var(--sep);color:var(--t)}button.p{background:var(--a);color:#fff}
.row{display:flex;gap:8px;justify-content:flex-end;align-items:center}.m{color:var(--m);font-size:12px}pre{white-space:pre-wrap;margin:0;max-height:220px;overflow:auto}
[hidden]{display:none!important}
</style></head>
<body>
<header><h1>✨ Prompt Converter</h1><button id="tab-set" aria-label="Settings">⚙︎</button></header>
<main>
  <section id="v-conv" class="card">
    <textarea id="in" placeholder="…"></textarea>
    <div class="row"><select id="mode" style="width:auto"></select><button class="p" id="go"></button></div>
    <pre id="out" hidden></pre>
    <div class="row" id="out-actions" hidden><span class="m" id="status"></span><button id="copy"></button></div>
  </section>
  <section id="v-set" class="card" hidden>
    <label id="l-prov"><select id="prov"></select></label>
    <label id="l-base"><input id="base" spellcheck="false"/></label>
    <label id="l-model"><input id="model" spellcheck="false"/></label>
    <label id="l-key"><input id="key" type="password" autocomplete="off"/></label>
    <label id="l-lang"><select id="lang"></select></label>
    <div class="row"><span class="m" id="saved"></span><button class="p" id="save"></button></div>
    <p class="m" id="privacy"></p>
  </section>
</main>
<script src="popup.js"></script>
</body></html>
